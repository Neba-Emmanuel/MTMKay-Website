<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      MTMKay IT Training & Consultancy | Cybersecurity, Cloud & Software
      Training in Cameroon
    </title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="MTMKay is a leading IT Training & Consultancy firm in Cameroon offering cybersecurity, cloud computing, web development, and international certification programs to accelerate tech careers and digital transformation."
    />
    <meta
      name="keywords"
      content="IT Training Cameroon, Cybersecurity Training Cameroon, Cloud Computing Cameroon, Web Development Training, IT Certification Africa, MTMKay Consultancy"
    />
    <meta name="author" content="MTMKay IT Training & Consultancy" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mtmkay.com/" />

    <!-- Geo Targeting -->
    <meta name="geo.region" content="CM" />
    <meta name="geo.placename" content="Cameroon" />

    <!-- Theme -->
    <meta name="theme-color" content="#1D4ED8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Unlock Your Future in Tech with MTMKay"
    />
    <meta
      property="og:description"
      content="Advance your tech career with expert-led training in cybersecurity, cloud computing, and software development. Trusted IT consultancy in Cameroon serving global clients."
    />
    <meta property="og:url" content="https://www.mtmkay.com" />
    <meta
      property="og:image"
      content="https://www.mtmkay.com/mtmkay_logo.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="MTMKay IT Training & Consultancy" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Unlock Your Future in Tech with MTMKay"
    />
    <meta
      name="twitter:description"
      content="Expert IT training and consultancy services in cybersecurity, cloud, and software development."
    />
    <meta
      name="twitter:image"
      content="https://www.mtmkay.com/mtmkay_logo.png"
    />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (SEO Booster) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "MTMKay IT Training & Consultancy",
        "url": "https://www.mtmkay.com",
        "logo": "https://www.mtmkay.com/mtmkay_logo.png",
        "description": "Leading IT Training & Consultancy firm in Cameroon offering cybersecurity, cloud computing, web development and international certification programs.",
        "areaServed": [
          {
            "@type": "Country",
            "name": "Cameroon"
          },
          {
            "@type": "Place",
            "name": "Worldwide"
          }
        ]
      }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: "#1D4ED8",
                light: "#3B82F6",
                dark: "#1E3A8A",
              },
              secondary: "#F59E0B",
              accent: "#10B981",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            animation: {
              "fade-in": "fadeIn 0.5s ease-in-out",
              "slide-in-up": "slideInUp 0.5s ease-in-out",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              slideInUp: {
                "0%": { transform: "translateY(20px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
